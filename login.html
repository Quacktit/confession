<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unspokenadc · Log in</title>
<link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand">unspoken<span>adc</span></div>
      <h1 id="auth-title">Log in</h1>
      <p class="muted">Your account is only for access. Nobody sees who you are.</p>
      <form id="auth-form">
        <input class="field" name="email" type="email" placeholder="Email" required autocomplete="email">
        <input class="field" name="password" type="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="current-password">
        <p id="auth-error" class="error"></p>
        <button id="auth-submit" class="btn" type="submit">Log in</button>
      </form>
      <p class="switch muted"><span id="auth-prompt">New here?</span> <button id="auth-toggle" type="button">Create an account</button></p>
    </div>
  </main>
<script src="/js/common.js"></script><script src="/js/auth.js"></script></body></html>
