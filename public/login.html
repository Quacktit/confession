<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unspokenADC · Log in</title>
<link rel="stylesheet" href="/css/global.css"></head>
<body data-page="login">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand">unspoken<span>ADC</span><p class="accent">anonymous</p></div>
      <h1 id="auth-title">Log in</h1>
      <p class="muted">Other users never see who you are. The site owner can see your email for safety or legal reasons. Read the <a href="/privacy.html">Privacy Policy</a>.</p>
      <form method="post" id="auth-form">
        <input class="field" name="email" type="email" placeholder="Email" required autocomplete="email">
        <input class="field" name="password" type="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="current-password">
        <p id="auth-error" class="error"></p>
        <button id="auth-submit" class="btn" type="submit">Log in</button>
      </form>
      <p class="switch muted"><a href="/forgot.html">Forgot password?</a></p>
      <p class="switch muted"><span id="auth-prompt">New here?</span> <button id="auth-toggle" type="button">Create an account</button></p>
    </div>
  </main>
  <footer class="site-footer"><a href="/privacy.html">Privacy Policy</a> · unspokenadc · an anonymous space for ADC students</footer>
<script src="/js/global.js"></script></body></html>
