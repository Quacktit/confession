<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unspokenadc · Reset password</title>
<link rel="stylesheet" href="/css/global.css"></head>
<body data-page="forgot">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand">unspoken<span>adc</span></div>
      <h1>Reset password</h1>
      <p class="muted">Enter your account email and we will send you a reset link.</p>
      <form id="forgot-form">
        <input class="field" name="email" type="email" placeholder="Email" required autocomplete="email">
        <p id="forgot-msg" class="error"></p>
        <button class="btn" type="submit">Send reset link</button>
      </form>
      <p class="switch muted"><a href="/login.html">Back to log in</a></p>
    </div>
  </main>
<script src="/js/global.js"></script></body></html>
