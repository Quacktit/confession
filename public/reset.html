<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unspokenadc · New password</title>
<link rel="stylesheet" href="/css/global.css"></head>
<body data-page="reset">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand">unspoken<span>adc</span></div>
      <h1>Choose a new password</h1>
      <form method="post" id="reset-form">
        <input class="field" name="password" type="password" placeholder="New password (min 8 characters)" required minlength="8" autocomplete="new-password">
        <input class="field" name="confirm" type="password" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
        <p id="reset-msg" class="error"></p>
        <button class="btn" type="submit">Update password</button>
      </form>
    </div>
  </main>
<script src="/js/global.js"></script></body></html>
